[versions]
app-barcodes-version-code = "25"
app-barcodes-version-name = "1.0.2"
app-cat-fact-version-code = "1"
app-cat-fact-version-name = "0.0.1"
app-cosmos-design-system-catalog-version-code = "6"
app-cosmos-design-system-catalog-version-name = "1.0.5"
app-finance-manager-version-code = "20"
app-finance-manager-version-name = "1.0.19"
app-make-apps-simple-version-code = "1"
app-make-apps-simple-version-name = "0.1.0"
library-cosmos-design-system-version-code = "6"
library-cosmos-design-system-version-name = "1.0.5"

android-compile-sdk = "36"
android-min-sdk = "29"
android-target-sdk = "36"

androidx-activity = "1.13.0"
androidx-lifecycle = "2.11.0-beta01"
androidx-test-core = "1.7.0"
androidx-test-runner = "1.7.0"
compose = "1.11.0"
detekt-compose-rules = "0.4.23"
java = "11"
junit = "1.3.0"
kotest = "6.1.11"
kotlin = "2.3.21"
kotlin-stdlib = "2.3.21"
kotlin-wrappers-browser = "2026.5.6"
kotlinx-collections-immutable = "0.4.0"
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
kotlinx-serialization-json = "1.11.0"
ktlint = "1.3.1"
material3 = "1.11.0-alpha07"
plugin-android-application = "9.1.1"
plugin-android-lint = "9.1.1"
plugin-detekt = "1.23.8"
plugin-dokka = "2.2.0"
plugin-kotlinx-binary-compatibility-validator = "0.18.1"
plugin-spotless = "8.5.1"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidx-test-core" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test-runner" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose" }
detekt-compose-rules = { module = "io.nlopez.compose.rules:detekt", version.ref = "detekt-compose-rules" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin-stdlib" }
kotlin-wrappers-browser = { module = "org.jetbrains.kotlin-wrappers:kotlin-browser", version.ref = "kotlin-wrappers-browser" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-collections-immutable" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
test-kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
test-kotlin = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[plugins]
plugin-android-application = { id = "com.android.application", version.ref = "plugin-android-application" }
plugin-android-lint = { id = "com.android.lint", version.ref = "plugin-android-lint" }
plugin-compose = { id = "org.jetbrains.compose", version.ref = "compose" }
plugin-detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "plugin-detekt" }
plugin-dokka = { id = "org.jetbrains.dokka", version.ref = "plugin-dokka" }
plugin-kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
plugin-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
plugin-kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
plugin-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "plugin-android-application" }
plugin-kotlinx-binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "plugin-kotlinx-binary-compatibility-validator" }
plugin-spotless = { id = "com.diffplug.spotless", version.ref = "plugin-spotless" }
